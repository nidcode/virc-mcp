name: CI

# テスト専用。デプロイは Cloudflare の Git 連携（Workers Builds）が行う。
# ここに Secrets を置かないこと —— 置かない限り、Runner が汚染されても奪われる鍵が無い。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      # root の tsc → worker の tsc → 単体テストまで一括で走る
      - run: npm test
